# Deployment settings for the tenant IdP.
#
# portalRedirectURI: the tenant portal's redirect URI pattern for client
# ai-grid-tenants. Set it to the MaaS gateway host of the ingress site
# (prototype Task 12: site-b), for example https://maas.apps.example.com/*.
# The realm is imported only when it doesn't exist, so a change after the
# first start must also be made in Keycloak (see README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-idp-settings
  namespace: tenant-idp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  portalRedirectURI: https://REPLACE-ME/*
