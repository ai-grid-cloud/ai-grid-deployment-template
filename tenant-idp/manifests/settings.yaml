# Deployment settings for the tenant IdP.
#
# portalRedirectURI: the tenant portal's redirect URI patterns for client
# ai-grid-tenants, separated by spaces or commas: https://maas.APPS_DOMAIN/* for
# each site, with APPS_DOMAIN that site's apps domain, for example
# https://maas.apps.east.example.com/* https://maas.apps.west.example.com/*.
# The realm is imported only when it doesn't exist, so a change after the
# first start must also be made in Keycloak (see README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-idp-settings
  namespace: tenant-idp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  portalRedirectURI: REQUIRED-portalRedirectURI
