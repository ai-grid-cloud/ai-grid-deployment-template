apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # site-b's public MaaS entry point (sites/site-b/maas-route). The library's
  # MaaS gateway serves its in-cluster certificate on the public hostname, which
  # no client can verify; this is the deployment's fix (finding F22, as on demo1).
  name: site-b-maas-route
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@deploymentRepoURL@'
    targetRevision: '@deploymentRevision@'
    path: sites/site-b/maas-route
  destination:
    server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/site-b
    namespace: openshift-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
