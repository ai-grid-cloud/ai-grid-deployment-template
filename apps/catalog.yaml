# The console's catalog: the AppProjects and ApplicationSets that deliver the
# models and subscriptions the provider console commits to your catalog
# repository (hub/catalog). Upstream main ships them in its acm-models component
# with the shared environment's catalog, so this deployment carries its own copy
# (docs/upstream-main-limits.md, L2). Same format as the library's
# apps/*/application.yaml: the root reads this file's metadata and spec as
# template parameters.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@deploymentRepoURL@'
    targetRevision: '@deploymentRevision@'
    path: hub/catalog
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - SkipDryRunOnMissingResource=true
