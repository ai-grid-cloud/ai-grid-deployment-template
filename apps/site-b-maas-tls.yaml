apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # A publicly trusted certificate for site-b's MaaS gateway
  # (sites/site-b/maas-tls); values/clusters/site-b/rhoai.yaml points the
  # gateway's HTTPS listener at it.
  name: site-b-maas-tls
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@deploymentRepoURL@'
    targetRevision: '@deploymentRevision@'
    path: sites/site-b/maas-tls
  destination:
    server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/site-b
    namespace: openshift-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
