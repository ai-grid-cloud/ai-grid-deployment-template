# Your AI Grid deployment: how to reach each cluster, its repositories and the
# install's options. Roles and locations aren't set here: you choose them in
# the provider console when you add a site to the grid (Add to AI Grid).
#
# Copy this file to one of two places, then replace every REQUIRED- value:
#
# - .config/clusters.yaml, for the one-command install (install guide, page 9;
#   make config copies it). Git ignores .config/, the file must be readable
#   only by you (chmod 600), and it's where your secrets go: uncomment the
#   token or username and password lines, and the github: and quay: sections.
#
# - clusters.yaml at the root, for the page-by-page guide (pages 1 to 8):
#   cp clusters-example.yaml clusters.yaml. You commit it, so it holds no
#   secrets: the scripts refuse token:, username:, password:, github: and quay:
#   in it. Leave those lines commented out.
#
# When .config/clusters.yaml exists, the scripts read it and ignore clusters.yaml.
apiVersion: ai-grid.dev/v1alpha1   # required header: the scripts parse this file with kubectl
kind: Clusters

# The ACM hub: runs Argo CD, ACM and the shared services, and no models. The
# scripts and the guide call it "hub".
hub:
  api: REQUIRED-hubAPIURL          # from oc whoami --show-server, e.g. https://api.hub.example.com:6443
  # Private file only: a cluster-admin login. Either a username and password
  # (the scripts get a fresh token on every run, so a rerun works the next day):
  # username: kubeadmin
  # password: PASSWORD
  # or a token (from oc whoami -t; it expires in about 24 h):
  # token: sha256~TOKEN

# The clusters the hub imports into ACM. You add each one to the grid, and
# choose its role and location, in the provider console.
sites:
  - name: REQUIRED-siteName        # its ACM name, a DNS label, e.g. site-1; fixed once imported
    api: REQUIRED-siteAPIURL       # e.g. https://api.site-1.example.com:6443
    # Private file only: a cluster-admin login, as for the hub.
    # username: kubeadmin
    # password: PASSWORD
    # token: sha256~TOKEN
  # Another site: copy the lines above, from "- name:".

repositories:
  # The catalog repository the provider console writes models and
  # subscriptions to, e.g. https://github.com/OWNER/ai-grid-catalog.git.
  # Page by page, leave it as it is: REQUIRED- here means no catalog yet.
  catalog: REQUIRED-catalogRepoURL
  # The library revision make install pins: a branch, a tag or a full commit
  # SHA, resolved to its current commit on each run. Empty keeps the
  # template's own pin in root/kustomization.yaml.
  library: deployment-template

# Private file only. Environment variables override these (install guide, page 9).
# github:
#   # Fine-grained token: Contents, Read and write, on the catalog repository only.
#   catalogToken: github_pat_TOKEN
#   # Optional: a token that can push to this repository. Without it, make
#   # install pushes with your own git login (gh or a credential helper).
#   deploymentToken: github_pat_TOKEN
# quay:
#   # Your quay.io/rhoai robot account.
#   username: rhoai+robot
#   password: PASSWORD

# Optional: make install's settings, shown with their defaults. Uncomment a
# line to change it. A setting left out comes from the environment variable of
# the same name, else the default.
options:
  # KEYCLOAK: install                    # only "install" is supported
  # ALLOW_GENERIC_LOGIN: 1               # let bootstrap use a general quay.io login from QUAY_AUTH_FILE
  # PROVIDER_ADMIN_TOKEN_DURATION: 168h  # lifetime of .config/provider-admin-token
  # GATE_ROOT_SECONDS: 600               # deployment-root Synced at the pushed commit
  # GATE_MCH_SECONDS: 1800               # the MultiClusterHub Running
  # GATE_HUB_APPS_SECONDS: 5400          # every hub Application Synced and Healthy
  # GATE_SITE_IMPORT_SECONDS: 900        # each site's import
  # GATE_READY_SECONDS: 600              # ready-check passes
  # GATE_INTERVAL: 15                    # seconds between a gate's checks
  # GATE_ERROR_LIMIT: 4                  # consecutive oc errors before a gate fails
