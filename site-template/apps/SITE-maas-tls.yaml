# Delivers sites/SITE/maas-tls to site SITE through ACM's cluster proxy
# (library docs/install/spokes/maas-certificate.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: SITE-maas-tls
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: '@deploymentRepoURL@'
    targetRevision: '@deploymentRevision@'
    path: sites/SITE/maas-tls
  destination:
    server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/SITE
    namespace: openshift-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
