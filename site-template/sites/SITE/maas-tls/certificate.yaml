# A publicly trusted certificate for site SITE's MaaS hostname, from the site's
# DNS-01 ClusterIssuer (library docs/install/spokes/maas-certificate.md).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maas-gateway-public
  namespace: openshift-ingress
spec:
  secretName: maas-gateway-public-tls
  dnsNames:
    - maas.APPS_DOMAIN
  issuerRef:
    kind: ClusterIssuer
    name: DNS01_ISSUER
