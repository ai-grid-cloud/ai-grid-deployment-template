# Site SITE's values for the OpenShift AI chart (library
# docs/install/spokes/maas-certificate.md and docs/install/hub/00-platform-services.md).
#
# On a site that already runs the platform's cert-manager operator, uncomment
# the three dependencies lines: the chart's own copy adds a second
# OperatorGroup, and OLM fails the operator with TooManyOperatorGroups.
# dependencies:
#   certManager:
#     enabled: false

# The MaaS gateway: its hostname, and the HTTPS listener on the certificate
# from sites/SITE/maas-tls. The hostname is the one the library's policy sets,
# given here too so the gateway has it from its first sync. Helm replaces lists
# whole, so both of the chart's listeners are given.
components:
  aigateway:
    modelsAsAService:
      gateway:
        annotations:
          ai-grid/maas-gateway-hostname-prefix: maas
        spec:
          listeners:
            - name: http
              hostname: maas.APPS_DOMAIN
              port: 80
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values: [openshift-ingress, models-as-a-service, redhat-ai-gateway-infra]
            - name: https
              hostname: maas.APPS_DOMAIN
              port: 443
              protocol: HTTPS
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values: [openshift-ingress, models-as-a-service, redhat-ai-gateway-infra]
              tls:
                mode: Terminate
                certificateRefs:
                  - group: ""
                    kind: Secret
                    name: maas-gateway-public-tls
